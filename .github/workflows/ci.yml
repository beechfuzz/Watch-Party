name: CI

# Go build/vet/test/race plus the frontend JS tests (sync math, playlist
# selection logic, native-pause/ended event forwarding, hls.js instance
# lifecycle, sidebar panel state, and the [hidden]-vs-CSS regression guard —
# see ARCHITECTURE.md §11.5), on every push and pull request against main.
# The frontend step previously only ran sync.test.mjs by name, silently
# never running the other four *.test.mjs files that already existed —
# fixed to the glob CLAUDE.md always documented running. Deliberately
# separate from docker-publish.yml, which already validates the Docker
# build on every PR — this workflow never touches the image.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.0" # matches the `go` directive in go.mod
          cache: true # caches the module download cache keyed on go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
        # internal/privdrop's real privilege-drop tests require euid 0 and
        # t.Skip themselves otherwise (see CLAUDE.md) — this runner is
        # non-root by default, so they're expected to skip here, not fail.

      - name: Test (race detector)
        run: go test -race ./...

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22" # node:test + top-level ESM import, no package.json to pin a version otherwise

      - name: Frontend JS tests
        run: node --test internal/webassets/web/static/js/*.test.mjs
