<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Watch Party</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="atmosphere"></div>

  <div class="app-shell">
  {{template "sidebar" .}}
  <main class="main-content party-main">

  <div class="party-topbar">
    <div class="party-title-block">
      <h2 id="party-title">Loading…</h2>
      <span id="party-subtitle">—</span>
    </div>
    <div class="sync-badge" id="sync-badge">
      <span class="sync-dot"></span>
      <span id="sync-text">Connecting…</span>
    </div>
    <div class="party-actions">
      <button class="icon-btn" id="invite-btn" title="Copy invite link">
        <svg viewBox="0 0 24 24" fill="none"><path d="M16 5.5a3 3 0 1 0-2.9 3.75L9 12.4a3 3 0 1 0 0 3.2l4.1 3.15a3 3 0 1 0 .9-1.6L10 13.9a3 3 0 0 0 0-3.8l4-3.15c.35.15.74.25 1.15.25a3 3 0 0 0 3-3.75z" fill="currentColor"/></svg>
      </button>
      <button class="icon-btn" id="party-settings-btn" title="Party Settings" hidden>
        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="2.8" stroke="currentColor" stroke-width="1.7"/><path d="M19.4 13.5a1.7 1.7 0 0 0 .34 1.87l.06.06a2.05 2.05 0 1 1-2.9 2.9l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56v.17a2.05 2.05 0 1 1-4.1 0v-.09a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2.05 2.05 0 1 1-2.9-2.9l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.03h-.17a2.05 2.05 0 1 1 0-4.1h.09a1.7 1.7 0 0 0 1.56-1.11 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2.05 2.05 0 1 1 2.9-2.9l.06.06a1.7 1.7 0 0 0 1.87.34H10a1.7 1.7 0 0 0 1.03-1.56v-.17a2.05 2.05 0 1 1 4.1 0v.09a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2.05 2.05 0 1 1 2.9 2.9l-.06.06a1.7 1.7 0 0 0-.34 1.87v.09a1.7 1.7 0 0 0 1.56 1.03h.17a2.05 2.05 0 1 1 0 4.1h-.09a1.7 1.7 0 0 0-1.56 1.03z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>

  <div class="party-layout">
    <div class="player-col">
      <div class="player-frame" id="player-frame">
        <video id="video" playsinline controls></video>
        <div class="player-idle" id="player-idle" hidden>
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 12l16-7-6 16-2.5-7L4 12z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
          <p>Nothing's playing yet.</p>
          <span id="player-idle-sub">Add something from the Playlist to get started.</span>
        </div>
        <div class="next-item-banner" id="next-item-banner" hidden>
          <span id="next-item-banner-text"></span>
        </div>
        <div class="chat-overlay" id="chat-overlay" hidden>
          <button type="button" class="chat-overlay-dismiss" id="chat-overlay-dismiss" title="Dismiss" aria-label="Dismiss">
            <svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          </button>
          <div class="chat-overlay-sender" id="chat-overlay-sender"></div>
          <div class="chat-overlay-text" id="chat-overlay-text"></div>
          <form class="chat-overlay-reply-row" id="chat-overlay-reply-form">
            <input type="text" id="chat-overlay-reply-input" placeholder="Reply…" maxlength="300" autocomplete="off">
            <button type="submit" class="chat-overlay-reply-btn" title="Send" aria-label="Send">
              <svg viewBox="0 0 24 24" fill="none"><path d="M4 12l16-7-6 16-2.5-7L4 12z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
            </button>
          </form>
        </div>
      </div>

      <div class="host-controls-row" id="host-controls" hidden>
        <button id="play-btn" class="btn btn-primary">Play</button>
        <button id="pause-btn" class="btn btn-ghost">Pause</button>
        <span class="host-caption"><strong>You're hosting</strong> — playback controls sync to everyone</span>
      </div>

      <div class="host-controls-row">
        <button id="fullscreen-btn" class="btn btn-ghost">⛶ Fullscreen</button>
        <button id="end-btn" class="btn btn-ghost" hidden>End party</button>
      </div>

      <p class="error" id="error" hidden></p>
    </div>

    <div class="party-sidebar-col" id="party-sidebar-col">
      <div class="sidebar-block" data-panel-key="watching-now">
        <button type="button" class="sidebar-block-header" data-panel-toggle="watching-now">
          <h4 id="participants-heading">Watching now</h4>
          <svg class="panel-chevron" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="sidebar-block-body"><div id="members"></div></div>
      </div>

      <div class="sidebar-resize-handle" data-resize-a="watching-now" data-resize-b="playlist" title="Drag to resize"></div>

      <div class="sidebar-block playlist-block" data-panel-key="playlist">
        <div class="sidebar-block-header-row">
          <button type="button" class="sidebar-block-header" data-panel-toggle="playlist">
            <h4>Playlist</h4>
            <svg class="panel-chevron" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="icon-btn" id="add-to-playlist-btn" title="Add to playlist" hidden>
            <svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
        </div>
        <div class="sidebar-block-body"><div id="playlist-items"></div></div>
      </div>

      <div class="sidebar-resize-handle" data-resize-a="playlist" data-resize-b="chat" title="Drag to resize"></div>

      <div class="chat-block sidebar-block" data-panel-key="chat">
        <button type="button" class="sidebar-block-header" data-panel-toggle="chat">
          <h4>Chat</h4>
          <svg class="panel-chevron" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="sidebar-block-body">
          <div class="chat-messages" id="chat-messages">
            <div class="chat-empty">
              <svg viewBox="0 0 24 24" fill="none"><path d="M4 12l16-7-6 16-2.5-7L4 12z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
              <span>No messages yet — say hello!</span>
            </div>
          </div>
          <div class="chat-input-row">
            <input type="text" id="chat-input" placeholder="Type a message…" maxlength="300">
            <button class="chat-send-btn" id="chat-send-btn" title="Send">
              <svg viewBox="0 0 24 24" fill="none"><path d="M4 12l16-7-6 16-2.5-7L4 12z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  </main>
  </div>

  <dialog id="browse-dialog">
    <div class="browse-dialog-inner">
      <div class="browse-header">
        <h3>Add to playlist</h3>
        <button type="button" class="icon-btn" id="browse-close-btn" title="Close">
          <svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="browse-body">
        <div class="browse-main">
          <input type="search" id="browse-search" class="browse-search" placeholder="Search your library…">
          <div class="browse-tabs" id="browse-tabs">
            <button type="button" class="browse-tab is-active" data-tab="movies">Movies</button>
            <button type="button" class="browse-tab" data-tab="tv">TV Shows</button>
            <button type="button" class="browse-tab" data-tab="recent">Recently Added</button>
            <button type="button" class="browse-tab" data-tab="favorites">Favorites</button>
          </div>
          <div class="browse-breadcrumb" id="browse-breadcrumb" hidden></div>
          <div class="browse-grid" id="browse-grid"></div>
          <p class="error" id="browse-error" hidden></p>
        </div>
        <div class="selected-media-panel">
          <div class="selected-media-header"><h4>Selected Media</h4></div>
          <div class="selected-media-list" id="selected-media-list"></div>
          <button type="button" class="btn btn-primary selected-media-add-btn" id="selected-media-add-btn" disabled>Add 0 Selected Items</button>
        </div>
      </div>
    </div>
  </dialog>

  <dialog id="confirm-large-selection-dialog">
    <h3>Add multiple items?</h3>
    <p class="confirm-text" id="confirm-large-selection-text"></p>
    <div style="display:flex; gap:10px; justify-content:flex-end;">
      <button type="button" class="btn btn-ghost" id="confirm-large-selection-cancel-btn">Cancel</button>
      <button type="button" class="btn btn-primary" id="confirm-large-selection-add-btn">Add</button>
    </div>
  </dialog>

  <dialog id="party-settings-dialog">
    <form id="party-settings-form">
      <h3>Party Settings</h3>
      <div class="field">
        <label for="settings-party-name">Party name</label>
        <input id="settings-party-name" type="text" required maxlength="200">
      </div>

      <div class="field">
        <label class="checkbox-field"><input type="checkbox" id="settings-auto-advance"><span>Auto-Advance Playlist</span></label>
      </div>
      <div class="field settings-subfield">
        <label class="checkbox-field"><input type="checkbox" id="settings-show-next-dialog"><span>Show "Next item in…" dialog</span></label>
      </div>
      <div class="field settings-subfield autoplay-delay-field">
        <label class="checkbox-field"><input type="checkbox" id="settings-autoplay-enabled"><span>Auto-play after</span></label>
        <input type="number" id="settings-autoplay-delay" min="1" max="120" value="5"> second(s)
      </div>

      <p class="error" id="party-settings-error" hidden></p>
      <div style="display:flex; gap:10px; justify-content:flex-end;">
        <button type="button" class="btn btn-ghost" id="cancel-party-settings-btn">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </dialog>

  <script>window.WATCH_PARTY_ID = {{.PartyID}};</script>
  <!-- Plain (non-module) script: hls.js's UMD build attaches itself as
       window.Hls this way, which player.js checks for. Only Safari plays
       HLS natively; everywhere else needs this for transcoded content —
       see ARCHITECTURE.md §5 and vendor/README.md. -->
  <script src="/static/js/vendor/hls.min.js"></script>
  <script type="module" src="/static/js/player.js"></script>
</body>
</html>
