<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Watch Party</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="atmosphere"></div>

  <div class="party-topbar">
    <div class="party-title-block">
      <h2 id="party-title">Loading…</h2>
      <span id="party-subtitle">—</span>
    </div>
    <div class="sync-badge" id="sync-badge">
      <span class="sync-dot"></span>
      <span id="sync-text">Connecting…</span>
    </div>
    <div class="party-actions">
      <button class="icon-btn" id="invite-btn" title="Copy invite link">
        <svg viewBox="0 0 24 24" fill="none"><path d="M16 5.5a3 3 0 1 0-2.9 3.75L9 12.4a3 3 0 1 0 0 3.2l4.1 3.15a3 3 0 1 0 .9-1.6L10 13.9a3 3 0 0 0 0-3.8l4-3.15c.35.15.74.25 1.15.25a3 3 0 0 0 3-3.75z" fill="currentColor"/></svg>
      </button>
      <button class="icon-btn" id="leave-btn" title="Leave party">
        <svg viewBox="0 0 24 24" fill="none"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>

  <div class="party-layout">
    <div class="player-col">
      <div class="player-frame">
        <video id="video" playsinline controls></video>
      </div>

      <div class="host-controls-row" id="host-controls" hidden>
        <button id="play-btn" class="btn btn-primary">Play</button>
        <button id="pause-btn" class="btn btn-ghost">Pause</button>
        <span class="host-caption"><strong>You're hosting</strong> — playback controls sync to everyone</span>
      </div>

      <div class="host-controls-row">
        <button id="fullscreen-btn" class="btn btn-ghost">⛶ Fullscreen</button>
        <button id="end-btn" class="btn btn-ghost" hidden>End party</button>
      </div>

      <p class="error" id="error" hidden></p>
    </div>

    <div class="party-sidebar-col">
      <div class="sidebar-block">
        <div class="sidebar-title"><h4 id="participants-heading">Watching now</h4></div>
        <div id="members"></div>
      </div>

      <div class="chat-block is-coming-soon">
        <div class="sidebar-title"><h4>Chat</h4><span class="coming-soon-badge">Coming Soon</span></div>
        <div class="chat-messages">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 12l16-7-6 16-2.5-7L4 12z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
          <span>Chat is coming soon</span>
        </div>
        <div class="chat-input-row">
          <input type="text" placeholder="Type a message…" disabled>
          <button class="chat-send-btn" disabled title="Coming soon">
            <svg viewBox="0 0 24 24" fill="none"><path d="M4 12l16-7-6 16-2.5-7L4 12z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>window.WATCH_PARTY_ID = {{.PartyID}};</script>
  <!-- Plain (non-module) script: hls.js's UMD build attaches itself as
       window.Hls this way, which player.js checks for. Only Safari plays
       HLS natively; everywhere else needs this for transcoded content —
       see ARCHITECTURE.md §5 and vendor/README.md. -->
  <script src="/static/js/vendor/hls.min.js"></script>
  <script type="module" src="/static/js/player.js"></script>
</body>
</html>
